<header class="header">
  <div class="header-container">
    <a routerLink="/cartelera" class="logo">
      <img
        src="assets/logo/logo-micine.png"
        alt="Metropoli Cine"
        class="logo-img">
    </a>

    <nav class="nav">
      <a routerLink="/cartelera" routerLinkActive="active">
        Cartelera
      </a>

      <a routerLink="/dulceria" routerLinkActive="active">
        Dulcería
      </a>

      <a routerLink="/mis-entradas" routerLinkActive="active">
        Mis boletos
      </a>

      @if (auth.esAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">
          Administración
        </a>
      }

      <div class="sesion">
        <span class="usuario">♙</span>

        <div class="datos-usuario">
          <span>{{ auth.usuario() }}</span>
          <small>{{ auth.rol() }}</small>
        </div>

        <button type="button" (click)="cerrarSesion()">
          Salir
        </button>
      </div>
    </nav>
  </div>
</header>
