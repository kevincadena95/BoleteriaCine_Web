<section class="acceso">
  <form [formGroup]="form" (ngSubmit)="entrar()">
    <h1>Acceso administrador</h1>
    <p>Ingresa con tu cuenta ADMIN.</p>
    <label>Correo<input type="email" formControlName="email" autocomplete="username" /></label>
    <label
      >Contraseña<input type="password" formControlName="password" autocomplete="current-password"
    /></label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button type="submit" [disabled]="form.invalid || ocupado()">
      {{ ocupado() ? 'Ingresando...' : 'Ingresar' }}
    </button>
    <a routerLink="/cartelera">Volver a cartelera</a>
  </form>
</section>
